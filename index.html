<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydroxyurea Initial Dosing Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  body { font-family: Arial, Helvetica, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h2 { margin-bottom: 0.25rem; }
  label { font-weight: bold; }
  select, input[type="number"] { padding: 0.35rem; margin: 0.25rem 0; }
  .required-asterisk { color: #c0392b; }
  #labDetailsBox { display: none; margin: 0.75rem 0; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  .output-box, .feedback-box { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
  pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
  textarea { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>

<h2>Welcome to the Hydroxyurea Initial Dosing Calculator</h2>
<h3>Enter Participant's Information</h3>

<form id="dosingForm">
  <p>
    <label>What formulation of hydroxyurea do you plan to use? <span class="required-asterisk">*</span></label><br>
    <select id="medTypeDropdown" required>
      <option value="" disabled selected>Formulation</option>
      <option value="capsule_100">100 mg Capsule</option>
      <option value="capsule_200">200 mg Capsule</option>
      <option value="capsule_300">300 mg Capsule</option>
      <option value="capsule_400">400 mg Capsule</option>
      <option value="capsule_500">500 mg Capsule</option>
      <option value="Siklos_1000">Siklos (eq 1000 mg dissolvable and scoreable tablets)</option>
      <option value="liquid_100">Hydroxyurea liquid suspension 100 mg/mL</option>
    </select>
  </p>

  <p>
    <label>What is your desired starting dose? For children, we recommend a starting dose of 25 mg/kg. <span class="required-asterisk">*</span></label><br>
    <select id="dosingDropdown" required>
      <option value="" disabled selected>Dose</option>
      <option value="15">15 mg/kg</option>
      <option value="20">20 mg/kg</option>
      <option value="25" selected>25 mg/kg</option>
    </select>
  </p>

  <p>
    <label>Do you have baseline laboratory values available? <span class="required-asterisk">*</span></label><br>
    <input type="radio" id="labs_yes" name="labs" value="true" required> <label for="labs_yes">Yes</label>
    &emsp;
    <input type="radio" id="labs_no" name="labs" value="false" required> <label for="labs_no">No</label>
  </p>

  <div id="labDetailsBox">
    <label>Hemoglobin</label>
    <input type="number" step="any" id="hemoglobinInput" min="0"> x10<sup>9</sup> g/L
    &ensp;
    <label>Platelet Count</label>
    <input type="number" step="any" id="plateletInput" min="0"> x10<sup>9</sup>/L
    &ensp;
    <label>Absolute Neutrophil Count <span class="required-asterisk">*</span></label>
    <input type="number" step="any" id="neutrophilInput" min="0"> x10<sup>9</sup>/L
    <br><br>
    <label>Absolute Reticulocyte Count</label>
    <input type="number" step="any" id="reticulocyteInput" min="0"> x10<sup>9</sup>/L
    &ensp; OR &ensp;
    <label>RBC Count</label>
    <input type="number" step="any" id="rbcInput" min="0"> x10<sup>9</sup>/L
    &ensp;
    <label>Reticulocyte percentage</label>
    <input type="number" step="any" id="reticulocytePercentInput" min="0">%
  </div>

  <p>
    <label>What is the patient's current weight in kg? <span class="required-asterisk">*</span></label><br>
    <input type="number" step="any" id="weightInput" min="0" required>
  </p>

  <p><button type="submit">Submit</button></p>
</form>

<div class="output-box" id="outputBox" style="display:none;">
  <h3>Dosing Recommendation</h3>
  <pre id="resultText"></pre>
  <button type="button" id="downloadPdfBtn" style="margin-top: 1rem;">⬇ Download as PDF</button>
</div>

<div class="feedback-box" id="feedbackBox" style="display:none;">
  <h4>Leave Feedback</h4>
  <textarea id="feedback-text" rows="3" placeholder="Was this recommendation helpful? Any issues?"></textarea>
  <p><button type="button" id="submitFeedbackBtn">Submit Feedback</button></p>
  <p id="feedback-status"></p>
</div>

<script>
/* ---------------------------------------------------------------
   Ported dosing logic (same as calculate.py / public/calculate.js)
   --------------------------------------------------------------- */
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function pythonRound(x) {
    const floor = Math.floor(x);
    const diff = x - floor;
    if (diff < 0.5) return floor;
    if (diff > 0.5) return floor + 1;
    return (floor % 2 === 0) ? floor : floor + 1;
}

function buildSchedule(capsPerDay, extraCaps) {
    const schedule = new Array(7).fill(capsPerDay);
    if (extraCaps > 0) {
        const step = 7 / extraCaps;
        const extraIndices = new Set();
        for (let i = 0; i < extraCaps; i++) extraIndices.add(pythonRound(i * step) % 7);
        for (const idx of extraIndices) schedule[idx] += 1;
    }
    const lines = [];
    for (let i = 0; i < 7; i++) {
        const day = DAYS[i];
        const caps = schedule[i];
        lines.push(caps === 0 ? `  ${day}: off` : `  ${day}: ${caps} ${caps === 1 ? "capsule" : "capsules"}`);
    }
    return lines.join("\n");
}

function formatScheduleBlock(capsPerWeek) {
    let capsPerDay, extraCaps;
    if (capsPerWeek >= 7) {
        capsPerDay = Math.floor(capsPerWeek / 7);
        extraCaps = capsPerWeek % 7;
    } else {
        capsPerDay = 0;
        extraCaps = capsPerWeek;
    }
    return buildSchedule(capsPerDay, extraCaps);
}

function capsuleDosing(dosePerWeek, dosePerDay, typeAmt, dosing, note = "") {
    if (dosePerDay % typeAmt === 0) {
        const caps = Math.floor(dosePerDay / typeAmt);
        const schedule = buildSchedule(caps, 0);
        return `${note}Recommended dose: ${dosePerDay.toFixed(2)} mg/day (${caps} ${caps === 1 ? "capsule" : "capsules"}/day)\n\nWeekly schedule:\n${schedule}`;
    }
    const capsDown = Math.floor(dosePerWeek / typeAmt);
    const capsUp = Math.ceil(dosePerWeek / typeAmt);
    const currentSchedule = formatScheduleBlock(capsDown);
    const currentMg = (capsDown * typeAmt) / 7;
    const lines = [
        `Recommended dose: ~${dosePerDay.toFixed(2)} mg/day`,
        `  → ${capsDown} capsules/week (${currentMg.toFixed(2)} mg/day average)\n`,
        `Weekly schedule:\n${currentSchedule}`,
    ];
    if (capsUp !== capsDown) {
        const newWeight = ((capsUp * typeAmt) / 7) / dosing;
        const newDoseMg = (capsUp * typeAmt) / 7;
        const nextSchedule = formatScheduleBlock(capsUp);
        lines.push(
            `\nEscalation (when weight reaches ${newWeight.toFixed(2)} kg):`,
            `  → ${capsUp} capsules/week (${newDoseMg.toFixed(2)} mg/day average)\n`,
            `Weekly schedule:\n${nextSchedule}`
        );
    }
    return lines.join("\n");
}

function calculateToxicity(labs) {
    const n = labs.neutrophil, p = labs.platelet, r = labs.reticulocyte, hb = labs.hemoglobin;
    if (n > 3.0 && p > 100 && (r > 50 && hb > 7)) return "Dose increase recommended";
    if (n > 1.5 && p > 120 && ((r > 100 && hb < 8) || (r > 75 && hb > 8))) return "Dose adjustment for weight gain recommended";
    if (n < 0.75 || p < 80 || (r < 50 && hb < 7)) return "Laboratory Toxicity - dose hold/reduction recommended";
    return "Dose is optimized, do not change";
}

function calculateInitialDosing(weight, medType, dosing, typeAmt, labsTrue = false, labs = null) {
    if (labsTrue) {
        if (labs.reticulocyte === 0 && labs.reticulocyte_percent && labs.rbc) {
            labs.reticulocyte = labs.reticulocyte_percent * labs.rbc;
        }
        const tox = calculateToxicity(labs);
        if (tox === "Laboratory Toxicity - dose hold/reduction recommended") {
            return "Laboratory Toxicity detected. Please review the patient's labs before calculating the initiating hydroxyurea dose.";
        }
    }
    const MAX_DAILY_DOSE = 2000;
    const rawDose = weight * dosing;
    const dosePerDay = Math.min(rawDose, MAX_DAILY_DOSE);
    const dosePerWeek = dosePerDay * 7;
    let note = "";
    if (rawDose > MAX_DAILY_DOSE) {
        note = `Note: Weight-based dose (${rawDose.toFixed(1)} mg/day) exceeds the ${MAX_DAILY_DOSE} mg/day maximum. Capping at ${MAX_DAILY_DOSE} mg/day.\n\n`;
    }
    if (medType === "capsule") return capsuleDosing(dosePerWeek, dosePerDay, typeAmt, dosing, note);
    if (medType === "liquid") {
        const mlPerDay = dosePerDay / typeAmt;
        return `Recommended dose: ${dosePerDay.toFixed(1)} mg/day (${mlPerDay.toFixed(2)} mL/day)`;
    }
    if (medType === "Siklos") {
        const capsDown = Math.floor(dosePerWeek / 250);
        const capsUp = Math.ceil(dosePerWeek / 250);
        const currentSchedule = formatScheduleBlock(capsDown);
        const lines = [
            `Recommended dose: ~${dosePerDay.toFixed(1)} mg/day`,
            `  → ${capsDown} scored tablet block(s)/week\n`,
            `Weekly schedule:\n${currentSchedule}`,
        ];
        if (capsUp !== capsDown) {
            const newWeight = ((capsUp * 250) / 7) / dosing;
            const nextSchedule = formatScheduleBlock(capsUp);
            lines.push(
                `\nEscalation (when weight reaches ${newWeight.toFixed(2)} kg):`,
                `  → ${capsUp} scored tablet block(s)/week\n`,
                `Weekly schedule:\n${nextSchedule}`
            );
        }
        return lines.join("\n");
    }
    return "Unknown medication type.";
}

/* ---------------------------------------------------------------
   Page wiring
   --------------------------------------------------------------- */
let lastRecommendation = "";
let lastPdfData = {};

document.querySelectorAll('input[name="labs"]').forEach(radio => {
    radio.addEventListener('change', () => {
        const show = radio.value === 'true' && radio.checked;
        document.getElementById('labDetailsBox').style.display = show ? 'block' : 'none';
    });
});

document.getElementById('dosingForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const medTypeRaw = document.getElementById('medTypeDropdown').value;
    const [medType, typeAmtStr] = medTypeRaw.split('_');
    const typeAmt = parseInt(typeAmtStr, 10);
    const dosing = parseFloat(document.getElementById('dosingDropdown').value);
    const weight = parseFloat(document.getElementById('weightInput').value);
    const labsTrue = document.querySelector('input[name="labs"]:checked').value === 'true';

    let labs = null;
    if (labsTrue) {
        labs = {
            hemoglobin: parseFloat(document.getElementById('hemoglobinInput').value) || 0,
            reticulocyte: parseFloat(document.getElementById('reticulocyteInput').value) || 0,
            rbc: parseFloat(document.getElementById('rbcInput').value) || 0,
            platelet: parseFloat(document.getElementById('plateletInput').value) || 0,
            reticulocyte_percent: parseFloat(document.getElementById('reticulocytePercentInput').value) || 0,
            neutrophil: parseFloat(document.getElementById('neutrophilInput').value) || 0,
        };
    }

    const recommendation = calculateInitialDosing(weight, medType, dosing, typeAmt, labsTrue, labs);

    lastRecommendation = recommendation;
    lastPdfData = { weight, med_type: medTypeRaw, dosing, type_amt: typeAmt };

    document.getElementById('resultText').textContent = recommendation;
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('feedbackBox').style.display = 'block';

    notifyParentOfResize();
});

/* ---- PDF download (same jsPDF logic as the original app) ---- */
document.getElementById('downloadPdfBtn').addEventListener('click', function () {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const margin = 50;
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    let y = margin;

    const tableStyle = {
        theme: "plain",
        margin: { left: margin, right: margin },
        styles: { fontSize: 10, cellPadding: 5, lineColor: [180, 180, 180], lineWidth: 0.5 },
        headStyles: { fontStyle: "bold", fillColor: [240, 240, 240], textColor: [0, 0, 0] },
        columnStyles: { 0: { cellWidth: 180 } },
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(0, 0, 0);
    doc.text("Hydroxyurea Initial Dosing Recommendation", margin, y);
    y += 18;

    const dateStr = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(80, 80, 80);
    doc.text("Generated: " + dateStr, margin, y);
    y += 16;

    doc.setDrawColor(0);
    doc.line(margin, y, pageW - margin, y);
    y += 20;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(0, 0, 0);
    doc.text("Prescription Summary", margin, y);
    y += 6;

    doc.autoTable({
        ...tableStyle,
        startY: y,
        head: [["Parameter", "Value"]],
        body: [
            ["Patient Weight", lastPdfData.weight + " kg"],
            ["Formulation", lastPdfData.med_type.replace("_", " mg ")],
            ["Starting Dose", lastPdfData.dosing + " mg/kg/day"],
            ["Capsule Strength", lastPdfData.type_amt + " mg"],
        ],
    });
    y = doc.lastAutoTable.finalY + 24;

    function parseSchedule(text) {
        const rows = [];
        for (const line of text.split("\n")) {
            const trimmed = line.trim();
            for (const day of DAYS) {
                if (trimmed.startsWith(day + ":")) rows.push([day, trimmed.slice(day.length + 1).trim()]);
            }
        }
        return rows;
    }
    function parseBlocks(text) {
        const idx = text.indexOf("Escalation");
        if (idx === -1) return { current: text, escalation: null };
        return { current: text.slice(0, idx).trim(), escalation: text.slice(idx).trim() };
    }

    const { current, escalation } = parseBlocks(lastRecommendation);
    const currentRows = parseSchedule(current);
    const currentHeader = current.split("\n").find(l => l.trim()).trim();

    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(0, 0, 0);
    doc.text("Current Dosing Schedule", margin, y);
    y += 16;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(60, 60, 60);
    doc.text(currentHeader, margin, y);
    y += 8;

    doc.autoTable({
        ...tableStyle,
        startY: y,
        head: [["Day", "Dose"]],
        body: currentRows.length > 0 ? currentRows : [["—", currentHeader]],
    });
    y = doc.lastAutoTable.finalY + 24;

    if (escalation) {
        const escalationRows = parseSchedule(escalation);
        const escalationHeader = escalation.split("\n").find(l => l.trim()).trim();

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.text("Escalation Schedule", margin, y);
        y += 16;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.setTextColor(60, 60, 60);
        doc.text(escalationHeader, margin, y);
        y += 8;

        doc.autoTable({
            ...tableStyle,
            startY: y,
            head: [["Day", "Dose"]],
            body: escalationRows.length > 0 ? escalationRows : [["—", escalationHeader]],
        });
    }

    doc.setDrawColor(180, 180, 180);
    doc.line(margin, pageH - 40, pageW - margin, pageH - 40);
    doc.setFont("helvetica", "italic");
    doc.setFontSize(9);
    doc.setTextColor(120, 120, 120);
    doc.text("Clinical decision support tool only. Always confirm with a qualified clinician.", pageW / 2, pageH - 24, { align: "center" });

    doc.save("HU_dosing_" + lastPdfData.weight + "kg_" + dateStr.replace(/ /g, "_") + ".pdf");
});

/* ---- Feedback submission -------------------------------------
   TODO: point this at a real endpoint before relying on it.
   Easiest options: a Formspree endpoint (formspree.io), or a
   Google Apps Script Web App URL that appends to a Sheet.
   Until FEEDBACK_ENDPOINT is set, this just logs to the console
   so the button doesn't silently fail on you.
------------------------------------------------------------------ */
const FEEDBACK_ENDPOINT = ""; // e.g. "https://formspree.io/f/xxxxxxx"

document.getElementById('submitFeedbackBtn').addEventListener('click', async function () {
    const status = document.getElementById('feedback-status');
    const feedbackText = document.getElementById('feedback-text').value;

    const payload = {
        weight: lastPdfData.weight,
        med_type: lastPdfData.med_type,
        dosing: lastPdfData.dosing,
        type_amt: lastPdfData.type_amt,
        recommendation: lastRecommendation,
        feedback_text: feedbackText,
    };

    if (!FEEDBACK_ENDPOINT) {
        console.log("Feedback (no endpoint configured yet):", payload);
        status.textContent = "Feedback endpoint not set up yet — logged locally for now.";
        return;
    }

    status.textContent = "Submitting...";
    try {
        const res = await fetch(FEEDBACK_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        status.textContent = res.ok ? "Thanks for your feedback!" : "Something went wrong.";
    } catch (err) {
        status.textContent = "Something went wrong.";
    }
});

/* ---- Let the parent (Wix) know our height, for iframe resizing ---- */
function notifyParentOfResize() {
    if (window.parent !== window) {
        window.parent.postMessage({ type: "hu-calculator-resize", height: document.body.scrollHeight }, "*");
    }
}
window.addEventListener('load', notifyParentOfResize);
document.querySelectorAll('input[name="labs"]').forEach(r => r.addEventListener('change', () => setTimeout(notifyParentOfResize, 50)));
</script>
</body>
</html>
