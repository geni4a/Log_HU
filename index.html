<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydroxyurea Initial Dosing Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  body { font-family: Arial, Helvetica, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h2 { margin-bottom: 0.25rem; }
  label { font-weight: bold; }
  select, input[type="number"] { padding: 0.35rem; margin: 0.25rem 0; }
  .required-asterisk { color: #c0392b; }
  #labDetailsBox { display: none; margin: 0.75rem 0; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  .output-box, .feedback-box { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
  pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
  textarea { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>

<h2>Welcome to the Hydroxyurea Initial Dosing Calculator</h2>
<h3>Enter Participant's Information</h3>

<form id="dosingForm">
  <p>
    <label>What formulation of hydroxyurea do you plan to use? <span class="required-asterisk">*</span></label><br>
    <select id="medTypeDropdown" required>
      <option value="" disabled selected>Formulation</option>
      <option value="capsule_100">100 mg Capsule</option>
      <option value="capsule_200">200 mg Capsule</option>
      <option value="capsule_300">300 mg Capsule</option>
      <option value="capsule_400">400 mg Capsule</option>
      <option value="capsule_500">500 mg Capsule</option>
      <option value="Siklos_1000">Siklos (eq 1000 mg dissolvable and scoreable tablets)</option>
      <option value="liquid_100">Hydroxyurea liquid suspension 100 mg/mL</option>
    </select>
  </p>

  <p>
    <label>What is your desired starting dose? For children, we recommend a starting dose of 25 mg/kg. <span class="required-asterisk">*</span></label><br>
    <select id="dosingDropdown" required>
      <option value="" disabled selected>Dose</option>
      <option value="15">15 mg/kg</option>
      <option value="20">20 mg/kg</option>
      <option value="25" selected>25 mg/kg</option>
    </select>
  </p>

  <p>
    <label>Do you have baseline laboratory values available? <span class="required-asterisk">*</span></label><br>
    <input type="radio" id="labs_yes" name="labs" value="true" required> <label for="labs_yes">Yes</label>
    &emsp;
    <input type="radio" id="labs_no" name="labs" value="false" required> <label for="labs_no">No</label>
  </p>

  <div id="labDetailsBox">
    <label>Hemoglobin</label>
    <input type="number" step="any" id="hemoglobinInput" min="0"> x10<sup>9</sup> g/L
    &ensp;
    <label>Platelet Count</label>
    <input type="number" step="any" id="plateletInput" min="0"> x10<sup>9</sup>/L
    &ensp;
    <label>Absolute Neutrophil Count <span class="required-asterisk">*</span></label>
    <input type="number" step="any" id="neutrophilInput" min="0"> x10<sup>9</sup>/L
    <br><br>
    <label>Absolute Reticulocyte Count</label>
    <input type="number" step="any" id="reticulocyteInput" min="0"> x10<sup>9</sup>/L
    &ensp; OR &ensp;
    <label>RBC Count</label>
    <input type="number" step="any" id="rbcInput" min="0"> x10<sup>9</sup>/L
    &ensp;
    <label>Reticulocyte percentage</label>
    <input type="number" step="any" id="reticulocytePercentInput" min="0">%
  </div>

  <p>
    <label>What is the patient's current weight in kg? <span class="required-asterisk">*</span></label><br>
    <input type="number" step="any" id="weightInput" min="0" required>
  </p>

  <p><button type="submit">Submit</button></p>
</form>

<div class="output-box" id="outputBox" style="display:none;">
  <h3>Dosing Recommendation</h3>
  <pre id="resultText"></pre>
  <button type="button" id="downloadPdfBtn" style="margin-top: 1rem;">⬇ Download as PDF</button>
</div>

<div class="feedback-box" id="feedbackBox" style="display:none;">
  <h4>Leave Feedback</h4>
  <textarea id="feedback-text" rows="3" placeholder="Was this recommendation helpful? Any issues?"></textarea>
  <p><button type="button" id="submitFeedbackBtn">Submit Feedback</button></p>
  <p id="feedback-status"></p>
</div>

<script src="calculate.js"></script>
<script src="app.js"></script>
</body>
</html>
