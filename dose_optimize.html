  <div class="lab-subbox">
  <div class="lab-row">
    <label>Current Daily Hydroxyurea Dose (mg) <span class="required-asterisk">*</span></label>
    <input type="number" step="any" id="dose" min="0" required>
  </div>

  <div class="lab-or">OR</div>

  <div class="lab-row">
    <label>How many capsules per week?</label>
    <input type="number" step="any" id="caps_dose" min="0">
  </div>

  <div class="lab-row">
    <label>Formulation</label>
    <select id="medType">
      <option value="" disabled selected>Formulation</option>
      <option value="capsule_500">500 mg Capsule</option>
      <option value="Siklos_1000">Siklos (eq 1000 mg dissolvable and scoreable tablets)</option>
      <option value="capsule_100">100 mg Capsule</option>
      <option value="capsule_200">200 mg Capsule</option>
      <option value="capsule_300">300 mg Capsule</option>
      <option value="capsule_400">400 mg Capsule</option>
    </select>
  </div>
</div>

  <p>
    <label>Do you have concerns that the patient may have poor adherence? <span class="required-asterisk">*</span></label>
    &emsp;
    <input type="radio" id="adh_low" name="adherence" value="true" required> <label for="esc_yes">Yes</label>
    &emsp;
    <input type="radio" id="adh_hi" name="adherence" value="false" required> <label for="esc_no">No</label>
  </p>


  <p>
    <label>Has the patient had a dose escalation in the past 2 months? <span class="required-asterisk">*</span></label>
    &emsp;
    <input type="radio" id="esc_yes" name="escalation" value="true" required> <label for="esc_yes">Yes</label>
    &emsp;
    <input type="radio" id="esc_no" name="escalation" value="false" required> <label for="esc_no">No</label>
  </p>

  <p>
    <label>Has the patient had a dose reduction in the last 2 months? <span class="required-asterisk">*</span></label>
    &emsp;
    <input type="radio" id="red_yes" name="reduction" value="true" required> <label for="red_yes">Yes</label>
    &emsp;
    <input type="radio" id="red_no" name="reduction" value="false" required> <label for="red_no">No</label>
  </p>
   


  <h3>Lab Values</h3>
  <p>
    <label>Hemoglobin <span class="required-asterisk">*</span></label>
    <input type="number" step="any" id="hemoglobin" min="0" required> x10<sup>9</sup> g/dL
    &ensp;
      </p>
   <p>
    <label>Absolute Neutrophil Count <span class="required-asterisk">*</span></label>
    <input type="number" step="any" id="neutrophil" min="0" required> x10<sup>9</sup>/L
    <br><br>
      </p>
     <p>
    <label>Absolute Reticulocyte Count <span class="required-asterisk">*</span></label>
    <input type="number" step="any" id="reticulocyte" min="0" required> x10<sup>9</sup>/L
    &ensp;
   </p>
     <p>
    <label>Platelet Count <span class="required-asterisk">*</span></label>
    <input type="number" step="any" id="platelet" min="0" required> x10<sup>9</sup>/L
  </p>

  <p><button type="submit">Submit</button></p>
</form>

<div class="output-box" id="outputBox" style="display:none;">
  <h3>Dosing Recommendation</h3>
  <p id="resultView"></p>
</div>
